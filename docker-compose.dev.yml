# Tryb developerski z hot-reload (Vite)
# Zmiany w src/ są widoczne natychmiast w przeglądarce.
#
# Użycie:
#   docker compose -f docker-compose.dev.yml up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
